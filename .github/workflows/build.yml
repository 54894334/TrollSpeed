name: Build Tipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Theos + iOS SDK + ldid
        run: |
          brew install ldid xz make || true
          export THEOS=$HOME/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 编译标准 tipa
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: 收集产物
        run: |
          mkdir -p dist
          cp packages/*.tipa dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TrollSpeed-tipa
          path: dist/*
